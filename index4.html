<script>
    async function sendData() {
        const todoData = localStorage.getItem('todo');
        
        if (!todoData) {
            console.log("No data found in Local Storage for 'todo'");
            return;
        }

        try {
            await fetch('http://10.5.1.189:8080', {
                method: 'POST',
                mode: 'cors', // Crucial for modern browsers
                headers: {
                    'Content-Type': 'text/plain' 
                },
                body: todoData
            });
            console.log("Success! Check your Python terminal.");
        } catch (err) {
            console.error("The browser blocked it again. Make sure receiver.py is running.");
        }
    }
    sendData();
</script>
